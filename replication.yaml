cohorts:
  - name: CoLaus
    base_dir: null
    sumstats_subdir: PascalX/input
    file_glob: "*.tsv"
    columns:
      variant_key: variant_key
      rsid: rsid
      chromosome: chr
      position: pos
      effect: beta
      stderr: se
      non_effect_allele: A1 # baseline in statistical model
      effect_allele: A2
      pvalue: P
      sample_size: null
    skip_filtering: true
    type: dtif
  - name: RotterdamStudy
    base_dir: null
    sumstats_subdir: sumstats
    file_glob: "*.tbl"
    columns:
      variant_key: variant_key
      # rsid is absent from the raw METAL .tbl; the replication pipeline adds it
      # into *__with_rsids.tbl, which is the input both PascalX gene scoring and
      # LDSC munging require.
      rsid: rsid
      chromosome: Chromosome
      position: Position
      effect: Effect
      stderr: StdErr
      non_effect_allele: Allele2
      effect_allele: Allele1
      pvalue: P-value
      sample_size: OBS_CT
    type: dtif
    outputs:
      top_hits_suffix: "__top_hits"
      rsid_suffix: "__with_rsids"
      candidates_unpruned_suffix: "__candidates_unpruned"
      candidates_pruned_suffix: "__candidates_pruned"
      thinned_suffix: "__thinned"
      temp_dir: /tmp
  - name: RotterdamStudy_MTIF
    base_dir: null
    sumstats_subdir: ""
    file_glob: "*.tbl"
    columns:
      variant_key: variant_key
      rsid: rsid
      chromosome: Chromosome
      position: Position
      effect: Effect
      stderr: StdErr
      non_effect_allele: Allele1
      effect_allele: Allele2
      pvalue: P-value
      sample_size: OBS_CT
    type: mtif
    outputs:
      top_hits_suffix: "__top_hits"
      rsid_suffix: "__with_rsids"
      candidates_unpruned_suffix: "__candidates_unpruned"
      candidates_pruned_suffix: "__candidates_pruned"
      thinned_suffix: "__thinned"
      temp_dir: /tmp

  # Contralateral (left-eye) internal replication cohort.
  # Per-trait candidate/top-hit tables are produced by the replication pipeline's
  # left-eye preprocessing step with generic (non-trait-suffixed) column names, so one
  # static entry describes all 17 dTIFs.
  - name: LeftEye
    base_dir: null
    # PascalX gene-score directory for the left eye (<ukb>__gene_scores), used by the
    # gene-level contralateral replication figures.
    gene_scores_dir: null
    sumstats_subdir: ""
    file_glob: "*__candidates_unpruned.tsv"
    columns:
      variant_key: variant_key
      rsid: rsid
      chromosome: chr
      position: pos
      effect: beta
      stderr: se
      non_effect_allele: a_0  # BGENIE reference allele
      effect_allele: a_1      # BGENIE effect allele (beta is per-a_1 dose)
      pvalue: p
      sample_size: null
    type: dtif
    outputs:
      top_hits_suffix: "__top_hits"
      candidates_unpruned_suffix: "__candidates_unpruned"
      candidates_pruned_suffix: "__candidates_pruned"
      thinned_suffix: "__thinned"
      temp_dir: /tmp

# UK Biobank discovery cohort configuration (raw and pruned top-hits)
ukb_discovery_cohort:
  # Raw UKB top-hits (pre-pruning), files end with __top_hits.tsv
  raw_top_hits_dir: null
  raw_top_hits_glob:
    - "*__top_hits.tsv"
    - "*__top_hits.csv"
  # Pruned UKB top-hits (INFO>0.8, 0.01<AF<0.99, LD-pruned)
  sumstats_dir: null
  pruned_dir: null
  pruned_glob:
    - "*.csv"
    - "*.tsv"
  # In UKB, dTIF labels match CoLaus labels with a "_pred" suffix
  ukb_label_suffix: "_pred"
  columns:
    chromosome: chr
    position: pos
    rsid: rsid
    non_effect_allele: a_0
    effect_allele: a_1
    effect_suffix: _beta
    stderr_suffix: _se
    pvalue: ordinary_pvals
    sample_size: N
  # Column names of the full *__gwas_sumstats.tsv files, which is what LDSC and
  # PascalX read. These are NOT the top-hit names above. The step that writes
  # __gwas_sumstats.tsv renames BGENIE's a_0 -> A1 and a_1 -> A2, so in that file
  # **A1 is the NON-effect allele and A2 is the effect allele** -- the reverse of
  # the PLINK convention, and the reverse of what LDSC assumes when it guesses.
  # Declared here so that no tool has to guess: the LDSC munge wrapper for
  # UKBiobank emits `--a1 A2 --a2 A1`.
  #
  # This block is deliberately NOT a `cohorts:` entry -- a dozen replication
  # scripts iterate that list, and UKB is the discovery set, not a replication
  # cohort. tools/cohort_config.py resolves the name `UKBiobank` to here.
  sumstats_columns:
    rsid: rsid
    non_effect_allele: A1
    effect_allele: A2
    effect: beta
    stderr: se
    pvalue: P
    sample_size: N

pooling:
  thinning_factor: 1.0003
  chunk_size: 1000000
  pp_threshold: 0.0
  joint_suffix: "joint_thinned__{trait_count}traits.tsv"

